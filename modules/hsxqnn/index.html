  .modulex-sayac-kara-tahta-fincan { position: relative; width: 62px; height: 42px; margin-block-start: 26px; border: 3px solid currentColor; border-block-start: 0; border-radius: 0 0 26px 26px; opacity: 0.85; }
  .modulex-sayac-kara-tahta-fincan::after { content: ""; position: absolute; inset-block-start: 6px; inset-inline-end: -19px; width: 16px; height: 18px; border: 3px solid currentColor; border-inline-start: 0; border-radius: 0 10px 10px 0; }

  .modulex-sayac-kara-tahta-buhar { position: absolute; inset-block-end: calc(100% + 4px); inset-inline-start: calc(22% + var(--b, 0) * 14px); width: 3px; height: 22px; border-radius: 3px; background: currentColor; opacity: 0; animation: modulex-sayac-kara-tahta-buhar 2.6s ease-in-out infinite; animation-delay: calc(var(--b, 0) * 0.5s); }
  .modulex-sayac-kara-tahta-buhar:nth-child(2) { --b: 1; }
  .modulex-sayac-kara-tahta-buhar:nth-child(3) { --b: 2; }
  @keyframes modulex-sayac-kara-tahta-buhar { 0% { opacity: 0; transform: translateY(6px) scaleY(0.6); } 40% { opacity: 0.6; } 100% { opacity: 0; transform: translateY(-14px) scaleY(1.1) skewX(-12deg); } }
  .modulex-sayac-kara-tahta-canli { position: absolute; inset-block-start: 18px; inset-inline-end: 18px; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 14px; border: 2px dashed color-mix(in srgb, --bg-- 60%, transparent); border-radius: 999px; background: transparent; color: --bg--; font: inherit; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; transition: border-color 0.25s ease, background 0.25s ease; }

  .modulex-sayac-kara-tahta-canli-i { font-size: 18px; }
  .modulex-sayac-kara-tahta-canli[aria-pressed="true"] .modulex-sayac-kara-tahta-canli-i--surdur, .modulex-sayac-kara-tahta-canli[aria-pressed="false"] .modulex-sayac-kara-tahta-canli-i--dur { display: none; }

  .modulex-sayac-kara-tahta-yazi { display: grid; justify-items: center; align-content: start; gap: 8px; text-align: center; clip-path: inset(0 0 0 0); transition: clip-path 1.1s cubic-bezier(0.6, 0, 0.3, 1) calc(var(--i) * 0.18s); }
  .modulex-sayac-kara-tahta--hazir:not(.modulex-sayac-kara-tahta--gor) .modulex-sayac-kara-tahta-yazi { clip-path: inset(0 100% 0 0); }
  [dir="rtl"] .modulex-sayac-kara-tahta--hazir:not(.modulex-sayac-kara-tahta--gor) .modulex-sayac-kara-tahta-yazi { clip-path: inset(0 0 0 100%); }
  .modulex-sayac-kara-tahta-cizim { display: inline-grid; place-items: center; width: 50px; height: 50px; border: 2px dashed color-mix(in srgb, --bg-- 55%, transparent); border-radius: 50%; font-size: 24px; }
  .modulex-sayac-kara-tahta-rakam { position: relative; display: inline-flex; align-items: baseline; font-family: var(--mx-font-heading, Georgia, serif); font-size: clamp(2.6rem, 5vw, 3.6rem); font-style: italic; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; text-decoration: underline wavy color-mix(in srgb, --bg-- 45%, transparent); text-decoration-thickness: 2px; text-underline-offset: 0.18em; }
  .modulex-sayac-kara-tahta-ek { font-size: 0.55em; }
  .modulex-sayac-kara-tahta-nabiz { position: absolute; inset-block-start: 6px; inset-inline-end: -16px; width: 10px; height: 10px; border-radius: 50%; background: color-mix(in srgb, --accent-- 55%, --bg--); }
  .modulex-sayac-kara-tahta--canli .modulex-sayac-kara-tahta-nabiz { animation: modulex-sayac-kara-tahta-nabiz 1.4s ease-in-out infinite; }
  @keyframes modulex-sayac-kara-tahta-nabiz { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
  .modulex-sayac-kara-tahta-tik { animation: modulex-sayac-kara-tahta-tik 0.6s ease; }
  @keyframes modulex-sayac-kara-tahta-tik { 0% { text-shadow: 0 0 0 transparent; } 30% { text-shadow: 0 0 14px color-mix(in srgb, --bg-- 70%, transparent); } 100% { text-shadow: 0 0 0 transparent; } }
  .modulex-sayac-kara-tahta-etiket { font-size: 1.02rem; font-weight: 700; letter-spacing: 0.06em; line-height: 1.35; text-transform: uppercase; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-kara-tahta :is(.modulex-sayac-kara-tahta-baslik, .modulex-sayac-kara-tahta-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-kara-tahta-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-kara-tahta { padding-inline: 16px; }

  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-kara-tahta *, .modulex-sayac-kara-tahta *::before, .modulex-sayac-kara-tahta *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-kara-tahta";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const akis = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-akis]")].filter((e) => Number(e.dataset.hiz) > 0 && Number.isFinite(Number(e.dataset.akis)));
        const b = s.querySelector("[data-akis-dugme]");
        if (!el.length || !b) return;
        const dl = document.documentElement.lang || undefined;
        const L = el.map((e) => {
          const od = Math.min(3, Math.max(0, Number(e.dataset.ondalik) || 0));
          let f = null;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { f = null; }
          return { e, f, v: Number(e.dataset.akis), adim: Math.pow(10, -od), ara: Math.min(15000, Math.max(az ? 5000 : 900, 60000 / Number(e.dataset.hiz))), zm: 0 };
        });
        const tik = (o) => {
          o.v += o.adim;
          o.e.textContent = o.f ? o.f.format(o.v) : String(o.v);
          if (az) return;
          o.e.classList.remove(P + "-tik");
          void o.e.offsetWidth;
          o.e.classList.add(P + "-tik");
        };
        const bas = () => L.forEach((o) => { if (!o.zm) o.zm = setInterval(() => tik(o), o.ara); });
        const dur = () => L.forEach((o) => { clearInterval(o.zm); o.zm = 0; });
        let calis = true;
        const yaz = () => { b.setAttribute("aria-pressed", String(calis)); s.classList.toggle(P + "--canli", calis); };
        b.hidden = false;
        b.addEventListener("click", () => { calis = !calis; yaz(); if (calis) bas(); else dur(); });
        document.addEventListener("visibilitychange", () => { if (document.hidden) dur(); else if (calis) bas(); });
        yaz();
        bas();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      akis(s, P, az);
    });
  })();
</script>
