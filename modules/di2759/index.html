  .modulex-deger-prensip-deste-kart--0 :is(.modulex-deger-prensip-deste-kmetin, .modulex-deger-prensip-deste-ikon, .modulex-deger-prensip-deste-kno, .modulex-deger-prensip-deste-etiket), .modulex-deger-prensip-deste-kart--2 :is(.modulex-deger-prensip-deste-kmetin, .modulex-deger-prensip-deste-ikon, .modulex-deger-prensip-deste-kno, .modulex-deger-prensip-deste-etiket) { color: inherit; }
  .modulex-deger-prensip-deste-kno { color: --muted--; font-family: var(--mx-font-mono, ui-monospace, monospace); font-size: 0.85rem; }

<script>
  (() => {
    const P = "modulex-deger-prensip-deste";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const deste = (s, P) => {
        const d = s.querySelector("[data-deste]");
        if (!d) return;
        const k = [...d.children];
        if (k.length < 2) return;
        s.classList.add(P + "--js");
        d.tabIndex = 0;
        const say = s.querySelector("[data-deste-no]");
        let f = null;
        try { f = new Intl.NumberFormat(document.documentElement.lang || undefined); } catch (x) { f = null; }
        const sira = k.map((_, i) => i);
        const ciz = () => {
          sira.forEach((j, n) => {
            const e = k[j];
            e.style.setProperty("--d", String(Math.min(n, 4)));
            e.style.zIndex = String(k.length - n);
            e.classList.toggle(P + "--ust", n === 0);
            e.inert = n !== 0;
            if (n) e.setAttribute("aria-hidden", "true"); else e.removeAttribute("aria-hidden");
          });
          if (say) say.textContent = f ? f.format(sira[0] + 1) : String(sira[0] + 1);
        };
        const ileri = () => { sira.push(sira.shift()); ciz(); };
        const geri = () => { sira.unshift(sira.pop()); ciz(); };
        s.querySelectorAll("[data-deste-yon]").forEach((b) => b.addEventListener("click", () => { if (b.dataset.desteYon === "ileri") ileri(); else geri(); }));
        d.addEventListener("keydown", (e) => {
          const rtl = getComputedStyle(d).direction === "rtl";
          if (e.key === (rtl ? "ArrowLeft" : "ArrowRight")) { e.preventDefault(); ileri(); }
          else if (e.key === (rtl ? "ArrowRight" : "ArrowLeft")) { e.preventDefault(); geri(); }
        });
        let u = null;
        let x0 = 0;
        let dx = 0;
        d.addEventListener("pointerdown", (e) => {
          const t = e.target.closest("." + P + "--ust");
          if (!t || e.target.closest("a, button")) return;
          u = t;
          x0 = e.clientX;
          dx = 0;
          u.classList.add(P + "--surukle");
          if (u.setPointerCapture) u.setPointerCapture(e.pointerId);
        });
        d.addEventListener("pointermove", (e) => {
          if (!u) return;
          dx = e.clientX - x0;
          u.style.setProperty("--x", dx + "px");
          u.style.setProperty("--r", (dx / 18).toFixed(2) + "deg");
        });
        const birak = () => {
          if (!u) return;
          const t = u;
          u = null;
          t.classList.remove(P + "--surukle");
          t.style.removeProperty("--x");
          t.style.removeProperty("--r");
          if (Math.abs(dx) > 70) ileri();
        };
        d.addEventListener("pointerup", birak);
        d.addEventListener("pointercancel", birak);
        ciz();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      deste(s, P, az);
    });
  })();
</script>
